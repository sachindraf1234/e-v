    <script>
      // Suppress benign WebSocket connection failure messages in proxy environments
      window.addEventListener('error', function (e) {
        if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('websocket'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (e && e.reason && String(e.reason).includes('WebSocket')) {
          e.preventDefault();
        }
      });
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
